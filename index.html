<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dream Music</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #d8e7ff, #eee0ff);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.music-player {
    width: 100%;
    max-width: 430px;
    background: rgba(255,255,255,0.88);
    border-radius: 30px;
    padding: 25px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    text-align: center;
}

.logo {
    font-size: 30px;
    font-weight: bold;
    color: #ff6f9f;
    margin-bottom: 20px;
}

.cover {
    width: 270px;
    height: 270px;
    margin: auto;
    border-radius: 25px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0,0,0,0.18);
}

.cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.song-title {
    margin-top: 22px;
    font-size: 25px;
    font-weight: bold;
    color: #333;
}

.artist {
    margin-top: 8px;
    font-size: 17px;
    color: #777;
}

.time-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #777;
    margin-top: 15px;
}

#progress {
    width: 100%;
    cursor: pointer;
}

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin-top: 20px;
}

.controls button {
    border: none;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #f3f3f3;
    font-size: 20px;
    cursor: pointer;
    transition: 0.2s;
}

.controls button:hover {
    transform: scale(1.08);
}

#playBtn {
    width: 65px;
    height: 65px;
    background: #ff76a8;
    color: white;
    font-size: 27px;
}

.volume {
    margin-top: 20px;
}

.volume input {
    width: 80%;
}

.playlist {
    margin-top: 25px;
    text-align: left;
}

.playlist h3 {
    text-align: center;
    color: #444;
}

.song-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    border-radius: 15px;
    cursor: pointer;
    margin-top: 8px;
    background: #f7f7f7;
}

.song-item:hover {
    background: #ffe6ef;
}

.song-item.active {
    background: #ffd2e2;
}

.song-item img {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 10px;
}

.song-info {
    flex: 1;
}

.song-info strong {
    display: block;
    color: #333;
}

.song-info small {
    color: #888;
}

@media(max-width: 500px) {

    .music-player {
        padding: 18px;
    }

    .cover {
        width: 230px;
        height: 230px;
    }

    .song-title {
        font-size: 21px;
    }
}
</style>
</head>

<body>

<div class="music-player">

    <div class="logo">🎵 Dream Music</div>

    <div class="cover">
        <img id="coverImage" src="./cover-1.jpg" alt="ปกเพลง">
    </div>

    <div class="song-title" id="songTitle">
        สิทธิ์ของเธอ
    </div>

    <div class="artist" id="artistName">
        อัสนี-วสันต์
    </div>

    <div class="time-row">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
    </div>

    <input
        type="range"
        id="progress"
        min="0"
        max="100"
        value="0"
    >

    <audio id="audio"></audio>

    <div class="controls">

        <button id="prevBtn">
            ⏮
        </button>

        <button id="playBtn">
            ▶
        </button>

        <button id="nextBtn">
            ⏭
        </button>

    </div>

    <div class="volume">
        🔊
        <input
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
        >
    </div>

    <div class="playlist">

        <h3>🎶 รายการเพลง</h3>

        <div id="playlist"></div>

    </div>

</div>

<script>

const songs = [

    {
        title: "สิทธิ์ของเธอ",
        artist: "อัสนี-วสันต์",
        src: "./song-1.mp3",
        cover: "./cover-1.jpg"
    },

    {
        title: "เหงา คิดถึง รอ",
        artist: "เสก โลโซ",
        src: "./song-2.mp3",
        cover: "./cover-2.jpg"
    },

    {
        title: "แพ้ใจ",
        artist: "เสก โลโซ",
        src: "./song-3.mp3",
        cover: "./cover-3.jpg"
    },

    {
        title: "รักเธอหัวทิ่มบ่อ",
        artist: "HANGMAN",
        src: "./song-4.mp3",
        cover: "./cover-4.jpg"
    }

];

let currentSong = 0;

const audio = document.getElementById("audio");
const playBtn = document.getElementById("playBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

const coverImage = document.getElementById("coverImage");
const songTitle = document.getElementById("songTitle");
const artistName = document.getElementById("artistName");

const progress = document.getElementById("progress");
const currentTime = document.getElementById("currentTime");
const duration = document.getElementById("duration");

const volume = document.getElementById("volume");
const playlist = document.getElementById("playlist");


function loadSong(index) {

    currentSong = index;

    const song = songs[currentSong];

    audio.src = song.src;

    coverImage.src = song.cover;

    songTitle.textContent = song.title;

    artistName.textContent = song.artist;

    updatePlaylist();

    progress.value = 0;

    currentTime.textContent = "0:00";

    duration.textContent = "0:00";
}


function playSong() {

    audio.play()
        .then(() => {
            playBtn.textContent = "⏸";
        })
        .catch(() => {
            alert(
                "เปิดเพลงไม่ได้ กรุณาตรวจสอบว่าไฟล์เพลงอยู่ในโฟลเดอร์เดียวกับ index.html และตั้งชื่อถูกต้อง"
            );
        });
}


function pauseSong() {

    audio.pause();

    playBtn.textContent = "▶";
}


playBtn.addEventListener("click", () => {

    if (audio.paused) {

        playSong();

    } else {

        pauseSong();

    }

});


nextBtn.addEventListener("click", () => {

    currentSong++;

    if (currentSong >= songs.length) {
        currentSong = 0;
    }

    loadSong(currentSong);

    playSong();

});


prevBtn.addEventListener("click", () => {

    currentSong--;

    if (currentSong < 0) {
        currentSong = songs.length - 1;
    }

    loadSong(currentSong);

    playSong();

});


audio.addEventListener("timeupdate", () => {

    if (!audio.duration) return;

    const percent =
        (audio.currentTime / audio.duration) * 100;

    progress.value = percent;

    currentTime.textContent =
        formatTime(audio.currentTime);

});


audio.addEventListener("loadedmetadata", () => {

    duration.textContent =
        formatTime(audio.duration);

});


progress.addEventListener("input", () => {

    if (!audio.duration) return;

    audio.currentTime =
        (progress.value / 100) * audio.duration;

});


volume.addEventListener("input", () => {

    audio.volume = volume.value;

});


audio.addEventListener("ended", () => {

    currentSong++;

    if (currentSong >= songs.length) {
        currentSong = 0;
    }

    loadSong(currentSong);

    playSong();

});


function formatTime(seconds) {

    if (isNaN(seconds)) {
        return "0:00";
    }

    const minutes = Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

    return `${minutes}:${secs}`;

}


function updatePlaylist() {

    playlist.innerHTML = "";

    songs.forEach((song, index) => {

        const item =
            document.createElement("div");

        item.className =
            "song-item" +
            (index === currentSong ? " active" : "");

        item.innerHTML = `

            <img
                src="${song.cover}"
                alt="${song.title}"
            >

            <div class="song-info">

                <strong>${song.title}</strong>

                <small>${song.artist}</small>

            </div>

        `;

        item.addEventListener("click", () => {

            loadSong(index);

            playSong();

        });

        playlist.appendChild(item);

    });

}


// เริ่มเพลงแรก
loadSong(0);

// ระดับเสียงเริ่มต้น
audio.volume = 0.8;

</script>

</body>
</html>
